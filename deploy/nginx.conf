# Include inside the existing TLS server for eveo-apps, before its default location.
# Do not create another server_name: this host also serves sufficit-checkout.
location = /telephony-panel { return 308 https://panel.sufficit.com.br/$is_args$args; }
location = /telephony-panel/signin-oidc {
    # OAuth callback query strings and cookies must not enter access logs.
    access_log off;
        proxy_pass http://unix:/run/sufficit-telephony-panel/panel.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;
        proxy_buffering off;
}
location /telephony-panel/ {
    rewrite ^/telephony-panel/(.*)$ https://panel.sufficit.com.br/$1 permanent;
}
