# Hermes web chat for permission problems (inbox "Atendimento", the same widget as www.sufficit.com.br).
# The website token is the public widget identifier. The HMAC secret is NOT here: it lives in the
# Identity Vault (hermes/web-widget/atendimento-hmac, context global) and is installed on the host as
# /etc/sufficit/telephony-panel/hermes-widget-hmac (root:sufftelpanel 0640). Without it the chat stays off.
[Service]
Environment=Support__BaseUrl=https://chatwoot.sufficit.com.br
Environment=Support__WebsiteToken=3s8j7X16xmruA1Yx2iFW3792
Environment=Support__HmacSecretFile=/etc/sufficit/telephony-panel/hermes-widget-hmac
