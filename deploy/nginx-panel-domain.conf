# Dedicated public name for the internal manager-only panel on Eveo.
server {
    listen 80;
    listen [::]:80;
    server_name panel.sufficit.com.br;
    return 308 https://panel.sufficit.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.sufficit.com.br;
    include snippets/certificate-sufficit-generic.conf;
    # OAuth callback query strings must never enter access logs.
    access_log off;
    # This callback is already registered in Identity; never redirect its code/state.
    location = /telephony-panel/signin-oidc {
        proxy_pass http://unix:/run/sufficit-telephony-panel/panel.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /telephony-panel { return 308 https://panel.sufficit.com.br/$is_args$args; }
    location ~ ^/telephony-panel/(.*)$ { return 308 https://panel.sufficit.com.br/$1$is_args$args; }
    location / {
        proxy_pass http://unix:/run/sufficit-telephony-panel/panel.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
}
